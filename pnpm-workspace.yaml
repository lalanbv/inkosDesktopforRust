packages:
  - "packages/*"
# pnpm 11 起构建脚本白名单从 package.json 的 pnpm 字段迁到这里。
# 三个包的 postinstall 都是常规二进制/类型生成，此前一直允许执行。
allowBuilds:
  esbuild: true
  msw: true
  protobufjs: true
# pnpm 11 起依赖覆写同样从 package.json 的 pnpm 字段迁到这里（旧位置的
# pnpm.overrides 已被静默忽略——277/278 号审计）。此覆写为安全修复：
# pi-ai(0.67.1 精确锁定)→@google/genai→protobufjs 传递链上的 critical
#（GHSA 任意代码执行）无法经升级 pi-ai 消除，只能强制覆盖传递版本。
overrides:
  protobufjs: ^7.5.8
  mermaid: ^11.16.1
  dompurify: ^3.4.13
  js-yaml: ^4.3.2
  "undici@7": 7.29.0
  "postcss@8": ^8.5.18
  "ws@8": ^8.21.0
  "fast-uri@3": ^3.1.6
  "vite@7.3.1": 7.3.5
  # 429 号：audit 剩余条目精确钉修复版（brace-expansion ReDoS / picomatch ReDoS /
  # browserslist 数据 / basic-ftp DoS / fast-xml-builder / ip-address）。
  "brace-expansion@2.0.2": ^2.1.4
  "picomatch@4.0.3": ^4.0.7
  "browserslist@4.28.1": ^4.28.8
  "basic-ftp@5.2.2": ^5.3.1
  "fast-xml-builder@1.1.4": ^1.1.7
  "ip-address@10.1.0": ^10.7.0
