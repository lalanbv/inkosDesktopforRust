packages:
  - "packages/*"
# pnpm 11 起构建脚本白名单从 package.json 的 pnpm 字段迁到这里。
# 三个包的 postinstall 都是常规二进制/类型生成，此前一直允许执行。
allowBuilds:
  # 548 号（R30）：@google/genai 2.x 起带构建脚本；0.73.1 时代未放行，
  # 维持不放行（纯 SDK 无需原生构建，少跑脚本更安全）。
  '@google/genai': false
  esbuild: true
  msw: true
  protobufjs: true
minimumReleaseAgeExclude:
  - '@earendil-works/chord@0.87.0'
  - '@earendil-works/pi-agent-core@0.87.0'
  - '@earendil-works/pi-ai@0.87.0'
  - '@earendil-works/pi-telemetry@0.87.0'
# pnpm 11 起依赖覆写同样从 package.json 的 pnpm 字段迁到这里（旧位置的
# pnpm.overrides 已被静默忽略——277/278 号审计）。此覆写为安全修复：
# pi-ai(0.67.1 精确锁定)→@google/genai→protobufjs 传递链上的 critical
#（GHSA 任意代码执行）无法经升级 pi-ai 消除，只能强制覆盖传递版本。
overrides:
  # 434 号：package.json 旧 pnpm.overrides 的 pi 系钉版迁入（pnpm 11 已静默
  # 忽略旧位置，每次 pnpm 命令刷 WARN）。直接依赖侧 packages/core、cli 亦
  # 精确锁 0.67.1，此处兜住传递链（全图强制同版，杜绝双拷贝）。
  # 548 号（R30）：pi 双包 scope 迁移 @mariozechner→@earendil-works 0.87.0
  #（旧 scope 0.73.1 为废弃终版）。直接依赖侧 packages/core 亦精确锁 0.87.0，
  # 此处兜住传递链（全图强制同版，杜绝双拷贝）。
  "@earendil-works/pi-ai": 0.87.0
  "@earendil-works/pi-agent-core": 0.87.0
  protobufjs: ^7.5.8
  mermaid: ^11.16.1
  # 556 号：dompurify afterSanitize 脱管子树 DOM XSS（GHSA-p98j-92pf-mc4p，
  # ^3.4.13 解析停在 3.4.15）→ 3.4.16 起修复。
  dompurify: ^3.4.16
  js-yaml: ^4.3.2
  "undici@7": 7.29.0
  "postcss@8": ^8.5.18
  "ws@8": ^8.21.0
  # 556 号：fast-uri percent-encoded host 大小写归一不一致（GHSA-hrr3-gc8f-f4qj，
  # ^3.1.6 解析停在 3.1.7）→ 3.1.8 起修复；同批改 major 范围键。
  "fast-uri@3": ^3.1.8
  "vite@7.3.1": 7.3.6
  # 429 号：audit 剩余条目精确钉修复版（brace-expansion ReDoS / picomatch ReDoS /
  # browserslist 数据 / basic-ftp DoS / fast-xml-builder / ip-address）。
  # 556 号：新披露 advisory 由精确键改 major 范围键全系收敛——精确键只覆盖
  # 当初命中版本，lockfile 重解析出的新版本（2.1.4/5.0.9/10.7.0）逃逸覆盖。
  # brace-expansion 递归 DoS 三连（GHSA-q2hr-2g5m-vwhr/GHSA-qhr7-859c-m2p7/
  # GHSA-6j4f-fj2g-mc7p）与 ip-address 解析诊断无界（GHSA-h3mg-xc3c-68pw）。
  "brace-expansion@2": ^2.1.7
  # 491 号：ts-morph→minimatch10 链的 brace-expansion 5.0.5 与 shadcn 链的
  # postcss-selector-parser 7.1.1 均在语义化范围内可直达补丁线。
  "brace-expansion@5": ^5.0.12
  "postcss-selector-parser@7.1.1": ^7.1.3
  # 501 号：fast-xml-parser 经 @aws-sdk/xml-builder（精确钉 5.5.8）与
  # provider-utils 4.0.23（ai 6.0.x 精确钉）——同 major 补丁线 override 出清。
  "fast-xml-parser": 5.7.0
  "@ai-sdk/provider-utils@4.0.23": 4.0.33
  "picomatch@4.0.3": ^4.0.7
  "browserslist@4.28.1": ^4.28.8
  "basic-ftp@5.2.2": ^5.3.1
  "fast-xml-builder@1.1.4": ^1.1.7
  "ip-address@10": ^10.7.2
  # 467 号：audit:npm 全量审计修复与接受边界（语义见 scripts/audit-npm.mjs 白名单）。
  # 555 号：undici WS permessage-deflate DoS（GHSA-3wwx-pv8p-q78v，6/7/8 线
  # 均受波及）——8.10.0 升 8.10.2（同 major 补丁线）；core 直依 6.28.0 同批升 6.28.1。
  "undici@8": 8.10.2
  uuid: ^11.1.1
  # 473 号：滚动复核发现 @babel/core 7.29.1 补丁（sourceMappingURL 任意文件读）
  # 在 dedupe 范围内即可达——覆盖钉升级，移出接受名单。
  "@babel/core": ^7.29.1
  # @ai-sdk/provider-utils 不覆写：ai@6.0.159 精确钉 4.0.23，强升 4.0.33+ 需
  # @ai-sdk/provider 3.0.16（npmmirror 缺）且破 ai 钉——LOW 级接受备案（467）。
