# 上游同步回归 CI：定时 merge Narcooo/inkos → 构建 → inkos doctor + SSE 契约测。
# 冲突/失败 → 开 issue 告警。兑现架构「跟随上游 release 自动同步」。
# （「写一章冒烟」需 LLM key，CI 无 key，故用 doctor + SSE 契约替代；写章留 opt-in。）
name: desktop-sync-regression

on:
  schedule:
    - cron: "17 3 * * *" # 每日 03:17 UTC（避开整点高峰）
  workflow_dispatch:

permissions:
  contents: write # merge 推送
  issues: write # 失败开 issue
  pull-requests: write

jobs:
  sync-regression:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # merge 需完整历史

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Configure upstream
        run: git remote add upstream https://github.com/Narcooo/inkos.git || git remote set-url upstream https://github.com/Narcooo/inkos.git

      - name: Fetch & merge upstream/master
        id: merge
        run: |
          set -euo pipefail
          git fetch upstream
          if git merge upstream/master --no-edit; then
            echo "merged=true" >> "$GITHUB_OUTPUT"
          else
            echo "merged=conflict" >> "$GITHUB_OUTPUT"
            git merge --abort
            exit 1
          fi

      - name: Build inkos
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: inkos doctor (structural health, no LLM)
        run: node packages/cli/dist/index.js doctor || node packages/cli/dist/index.js --version

      # SSE 契约测：本仓 observer default_table ⊆ inkos broadcast（防上游 SSE 改动静默打断）。
      - name: SSE contract test
        run: |
          cd src-tauri
          cargo test --test sse_contract -- --nocapture

      - name: Rust test suite
        run: |
          cd src-tauri
          cargo test --lib

      # 任一前置失败 → 这里开 issue 告警（CI 本身 fail，issue 提示人工介入）。
      - name: Open issue on failure
        if: failure()
        uses: JasonEtco/create-an-issue@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          filename: .github/desktop-sync-failure.md
          search_existing: open

      # merge 成功则推送（近零冲突时自动兑现同步）。
      - name: Push merge
        if: success()
        run: git push origin master
