# inkosDesktop 三平台构建 + 发布（桌面壳 CI，零交叉：不碰 inkos 既有 ci.yml/release.yml）。
# 触发：tag v*（发版，含 updater manifest + engine bundle）、PR/push master（仅构建校验）。
name: desktop-build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write # 发版创建 release + 上传 asset（仅 tag 触发时生效）

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
          - os: macos-13
            target: x86_64-apple-darwin
            label: macos-x64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
    steps:
      - uses: actions/checkout@v4

      # inkos 锁定 pnpm ≥9（pnpm.overrides 在 v10+ 弃用）→ 用 pnpm 9 与 inkos ci.yml 一致。
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Linux Tauri 系统依赖（webkit2gtk 等）。
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      # 构建 inkos（core+cli+studio dist）。CI=true 避免 pnpm 无 TTY 交互。
      - name: Build inkos
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # 组装 engine（PROD：cp -L 自包含 node_modules，打包进 .app 后用户机可用）。
      - name: Package engine (prod)
        env:
          CI: "true"
          INKOS_ENGINE_PROD: "1"
        run: ./scripts/desktop-package-engine.sh

      # engine bundle 发布物（updater engine 通道下载）：tar engine → 算 sha256。
      - name: Stage engine bundle
        shell: bash
        run: |
          VER=$(node -p "require('./packages/cli/package.json').version")
          cd src-tauri
          tar czf "../../engine-${VER}.tar.gz" engine
          shasum -a 256 "../../engine-${VER}.tar.gz" | awk '{print $1}' > "../../engine-${VER}.tar.gz.sha256"
          echo "engine bundle: engine-${VER}.tar.gz (+ .sha256)"

      # Tauri 构建 + 签名（gated：secrets 齐备才签）+ 发版 + updater manifest（Ed25519）。
      # tauri-action 在 TAURI_SIGNING_PRIVATE_KEY 存在时自动签 latest.json。
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # shell updater 签名（Ed25519）—— M3f 文档生成 keypair。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS 签名+公证（gated：secrets 齐备才生效，否则 ad-hoc；M3f）。
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "inkosDesktop ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

      # 上传 engine bundle + .sha256 到同一 release（engine 通道 updater 拉取）。
      - name: Upload engine bundle to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            engine-*.tar.gz
            engine-*.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: inkosDesktop-${{ matrix.label }}
          path: |
            src-tauri/target/*/release/bundle/*
            src-tauri/target/release/bundle/*
