[package]
name = "inkos-engine"
version = "0.0.1"
edition = "2021"
description = "inkos 业务引擎的 Rust 移植目标（packages/core → Rust）。Phase 0 骨架：模块占位 + 类型同步通道。"
license = "AGPL-3.0-only"
publish = false

# 设计原则（见 开发时SpecCoding'sPlan/.../全面Rust化迁移规划_v1.md）：
# - 与 src-tauri 壳层同款技术栈（tokio/serde/anyhow/thiserror/tracing），经验复用
# - 类型真源在本 crate，经 ts-rs 单向生成 .ts 供前端/Node 消费
# - 每个业务域一个模块，与 packages/core/src 的 16 域一一对应
# - 暂为纯库（无 main），由 src-tauri 或独立 axum 服务挂载

[lib]
name = "inkos_engine"
path = "src/lib.rs"

[features]
# 默认不导出 TS 绑定（避免每次 build 都写文件）；CI/发布用 --features export-bindings
export-bindings = ["ts-rs"]

[dependencies]
# 与壳层对齐的核心栈
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
# 正则：解析器移植用（chapter-memo-parser 等非热路径）。须与 TS 严格一致，手写易分歧；
# regex crate 配合 OnceLock 编译一次，零运行时多余分配。
regex = "1"
# HTTP 服务（strangler 切换面）：让已移植函数作为 /api/v1/* 端点服务，逐步替换 Node sidecar。
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "trace"] }
# URL 解析：guessServiceFromBaseUrl 提取 hostname，须与 TS new URL().hostname 同源（避免手写解析分歧）
url = "2"
# HTTP 客户端：流式 LLM 客户端用（chat completions SSE 流）。
# 用 rustls-tls 避免系统 OpenSSL 依赖；streaming 取 bytes_stream。
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = "0.3"
# 类型同步：Rust→TS 单向生成（见 src/models.rs 的 PoC）
# 默认 optional（feature 门控），保证骨架零额外依赖即可编译
ts-rs = { version = "10", optional = true, features = ["serde-json-impl"] }
# SQLite：memory-db 移植（node:sqlite → rusqlite）。用 bundled 从源码编译并静态链接，
# 与 crate 已有「rustls-tls 避系统 OpenSSL」的自包含哲学一致，跨平台一致行为、零系统依赖。
rusqlite = { version = "0.32", features = ["bundled"] }
# async trait：state-bootstrap/runtime-state-store/manager 等 async 编排的 fs 抽象基座（StateStore trait）。
async-trait = "0.1"
# UUID：chapter-workspace 版本归档的版本 id 生成（v4，与 TS crypto.randomUUID 对齐）。
uuid = { version = "1", features = ["v4"] }
# YAML：genre-profile / book-rules 的 frontmatter 解析（TS js-yaml 的对应物）。
# serde_yaml 0.9 已停止维护但仍是事实标准；解析面仅为受控 frontmatter，风险可控。
serde_yaml = "0.9"
# 临时目录：atomic-file-set 的事务目录 + 测试 fixture。
tempfile = "3"
async-stream = "0.3.6"

[dev-dependencies]
# 差分测试：Rust 实现 vs TS golden 向量（Phase 0.4 产出）
serde_json = "1"
# HTTP handler 单测（oneshot，不绑端口）
tower = { version = "0.5", features = ["util"] }
