[package]
name = "inkos-desktop"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["blocking"] }
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
dirs = "5"

[dev-dependencies]
tempfile = "3"
