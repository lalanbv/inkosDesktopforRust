[package]
name = "inkos-desktop"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
# M3b：项目目录选择对话框（Rust 侧 DialogExt，不经 webview ACL）。
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["blocking", "stream", "json"] }
tokio-stream = "0.1"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
thiserror = "1"
serde = { version = "1", features = ["derive"] }
# main.rs eval 错误消息用 serde_json::to_string 做规范 JS 字符串转义
# （替代手写 .replace('\n',..).replace('\'',...)，规避引号/反斜杠/控制字符注入）
serde_json = "1"
dirs = "5"
# M2b：OS keychain 抽象（macOS Keychain / Win Cred Manager / Linux Secret Service）。
#
# 平台后端必须显式开 feature：keyring v3 起所有后端都是可选的，
# 不开任何 feature 时它회 fallback 到**进程内存 mock**——写入看似成功，
# 进程退出即丢，重启后 read_all 返回空。这会让用户保存的凭据静默消失。
#   - apple-native      : macOS/iOS Security Framework（Keychain）
#   - windows-native    : Windows Credential Manager
#   - sync-secret-service: Linux Secret Service（同步 D-Bus，避免引入 async runtime）
#     crypto-rust: secret-service 的会话加密用纯 Rust 实现，免去 openssl 系统依赖。
keyring = { version = "3", features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
    "crypto-rust",
] }
# M2b Task 4：secrets.json 文件监听回写（spawn_writeback）。
# 选 v6（API 自 v6 起跨 v8 保持稳定，v6 最广泛验证；序列化兼容性最稳）。
notify = "6"
# M2b：atomic_write_0600 用 NamedTempFile（随机名 + persist 原子替换）。
#   - 随机名：消除固定 `secrets.json.tmp` 的符号链接攻击面
#   - 创建即 0600（Unix）：消除 fs::write 默认权限的短暂可读窗口
#   - .persist(path)：原子 rename（同 filesystem 保证）
# 同时仍是 dev-dep（测试 tempdir 依赖），下面 [dev-dependencies] 不再列。
tempfile = "3"
# M3a：EngineManifest SHA256 校验（engine bundle 完整性，M3d updater 下载校验）。
sha2 = "0.10"
# M3c：Node bootstrap——下载 .tar.gz 解压（unix；windows 用 zip crate）。
flate2 = "1"
tar = "0.4"
# M3d：版本比较（engine/node 版本探测）+ engine 通道 updater 逻辑。
semver = "1"
# M3d：shell 通道自更新（Tauri updater + Ed25519）。
tauri-plugin-updater = "2"
# M5a：工作区 ID 生成（UUID v4）。
uuid = { version = "1", features = ["v4", "serde"] }
# M5b：配置分层系统（TOML 格式）。
toml = "0.8"
# M4a：可观测性——结构化日志（tracing + subscriber + 滚动文件）。
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2"
# M6a：项目索引数据库（SQLite 嵌入式数据库）。
rusqlite = { version = "0.32", features = ["bundled"] }
# M6c：项目扫描器（文件系统遍历）。
walkdir = "2.5"
# M7a：WASM 插件运行时（Wasmtime 27+ 稳定 API + Component Model 支持）。
wasmtime = { version = "27", features = ["component-model", "cranelift"] }
# M7a：WASI 环境支持（文件系统、环境变量等）。
wasmtime-wasi = "27"
# Phase 6.1：增量更新——bsdiff 二进制 delta（纯 Rust，safe Rust，无 C 依赖）。
# 客户端用 patch 应用 delta，配合 sha256 校验，显著减小 engine bundle 更新体积。
bsdiff = "0.2"
# Phase 6.5：Ed25519 签名验证——engine bundle 来源认证（防 MITM 替换）。
# 与 shell 通道（tauri-plugin-updater 的 Ed25519）对称，纯 Rust。
ed25519-dalek = { version = "2", features = ["rand_core"] }
# Phase 6 网络白名单：插件 host_api 的 HTTP 代理（域名白名单校验）。
# 纯同步——reqwest::blocking 在 tokio 上下文（WASM execute 经 async manager 调用）
# 会因嵌套 runtime panic；ureq 无 runtime，安全用于同步 Host trait。
ureq = "2"
[target.'cfg(windows)'.dependencies]
zip = "2"

[dev-dependencies]
# tempfile 已提升为常规 dep（M2b 加固：atomic_write 使用 NamedTempFile）。
# M4b：E2E 回归测试框架（binary 测试 + 断言）。
assert_cmd = "2.0"
predicates = "3.0"
# Phase 6.5：sig 模块测试需要生成 Ed25519 密钥对（OsRng）。
rand = "0.8"
# 性能精细 bench（async_tokio：scanner.scan 是 async）。
# perf_scanner/perf_plugin_wasm 提供回归断言；criterion 提供统计分析（最优解）。
criterion = { version = "0.5", features = ["async_tokio"] }

[[bench]]
name = "scanner"
harness = false

[[bench]]
name = "plugin_execute"
harness = false

# Unix 进程组信号：kill_tree 用 libc::kill(-pgid, SIGTERM) 杀整个进程组，
# 避免 inkos CLI 派生的 tsx 孙子进程被 PID 1 收养后变孤儿继续占端口。
[target.'cfg(unix)'.dependencies]
libc = "0.2"
