<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <title>inkosDesktop</title>
    <style>
      html, body {
        margin: 0; height: 100%;
        background: #fafafa; color: #1a1a1a;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }
      main {
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        height: 100%; padding: 2rem; text-align: center; box-sizing: border-box;
      }
      h1 { font-weight: 600; margin: 0 0 1.5rem; font-size: 1.25rem; }
      p { color: #666; margin: 0.5rem 0; }
      button {
        font: inherit; padding: 0.6rem 1.2rem; border: 1px solid #d0d0d0;
        background: #fff; color: #1a1a1a; border-radius: 8px; cursor: pointer;
        transition: background 0.15s;
      }
      button:hover { background: #f0f0f0; }
      button.primary { background: #2563eb; color: #fff; border-color: #2563eb; }
      button.primary:hover { background: #1d4ed8; }
      button.link-btn { border: none; background: none; color: #2563eb; padding: 0.3rem 0.6rem; font-size: 0.85rem; }
      button.link-btn:hover { background: #eff6ff; text-decoration: underline; }
      #recents { list-style: none; padding: 0; margin: 1rem 0; max-width: 28rem; width: 100%; }
      #recents li {
        padding: 0.7rem 0.9rem; border: 1px solid #e0e0e0; border-radius: 8px;
        margin-bottom: 0.5rem; cursor: pointer; text-align: left;
        display: flex; justify-content: space-between; align-items: center; gap: 0.5rem;
      }
      #recents li:hover { background: #f0f6ff; border-color: #93c5fd; }
      #recents .path { color: #595959; font-size: 0.8rem; word-break: break-all; }
      /* M6f：类型徽章 + 收藏。数据来自 M6 索引；索引未命中时不渲染这些元素。 */
      #recents .meta { display: flex; align-items: center; gap: 0.4rem; }
      #recents .badge {
        font-size: 0.7rem; padding: 0.1rem 0.4rem; border-radius: 4px;
        background: #eef2ff; color: #4338ca; border: 1px solid #c7d2fe;
        white-space: nowrap;
      }
      #recents .fav {
        border: none; background: none; padding: 0.2rem; font-size: 0.95rem;
        line-height: 1; cursor: pointer; color: #d4d4d4; border-radius: 4px;
      }
      #recents .fav:hover { background: #e5e7eb; }
      #recents .fav.on { color: #f59e0b; }
      .hidden { display: none !important; }
      .err { color: #b91c1c; margin-top: 0.75rem; min-height: 1.2em; }
      .muted { color: #595959; font-size: 0.85rem; }
      .err-banner {
        background: #fef2f2; border: 1px solid #fecaca; border-radius: 8px;
        padding: 1rem; margin: 1rem 0; text-align: left; max-width: 28rem;
      }
      .err-banner h3 { color: #b91c1c; margin: 0 0 0.5rem; font-size: 0.95rem; }
      .err-banner p { color: #666; margin: 0.25rem 0; font-size: 0.85rem; }
      .err-banner .details { color: #595959; font-size: 0.75rem; margin-top: 0.5rem; font-family: monospace; }
      .err-banner button {
        margin-top: 0.5rem; padding: 0.4rem 0.8rem; font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <main>
      <!-- 启动中（auto 复用 或 选择后） -->
      <section id="launching" class="hidden">
        <h1>inkosDesktop 启动中…</h1>
        <p>正在拉起 inkos Studio sidecar，请稍候。</p>
      </section>

      <!-- 项目选择（首启 / 无有效 last_opened） -->
      <section id="picker">
        <h1>选择 inkos 项目目录</h1>
        <p class="muted">inkos 将在此目录读写数据（inkos.json、章节、记忆库）。</p>
        <ul id="recents"><!-- 最近项目由 JS 注入 --></ul>
        <button id="pick" class="primary">选择文件夹…</button>
        <div style="margin-top:0.5rem"><button id="open-plugins" class="link-btn">⚙ 插件管理</button></div>
        <p class="err" id="err"></p>
      </section>
    </main>

    <script>
      // Tauri 2 withGlobalTauri：暴露 window.__TAURI__.core.invoke（自定义 app 命令默认可调）。
      const { invoke } = window.__TAURI__.core;
      const launching = document.getElementById("launching");
      const picker = document.getElementById("picker");
      const recentsEl = document.getElementById("recents");
      const errEl = document.getElementById("err");

      function showLaunching() {
        picker.classList.add("hidden");
        launching.classList.remove("hidden");
      }

      function showErr(msg) {
        errEl.textContent = msg || "";
      }

      // 显示结构化错误（AppError）
      function showStructuredError(error) {
        // 如果是字符串，直接显示
        if (typeof error === "string") {
          showErr(error);
          return;
        }

        // 如果是结构化错误对象
        if (error && typeof error === "object") {
          const banner = document.createElement("div");
          banner.className = "err-banner";

          const title = document.createElement("h3");
          title.textContent = error.message || "操作失败";
          banner.appendChild(title);

          if (error.suggestion) {
            const suggestion = document.createElement("p");
            suggestion.textContent = "💡 " + error.suggestion;
            banner.appendChild(suggestion);
          }

          if (error.details) {
            const details = document.createElement("p");
            details.className = "details";
            details.textContent = "技术细节: " + error.details;
            banner.appendChild(details);
          }

          const retryBtn = document.createElement("button");
          retryBtn.textContent = "重试";
          retryBtn.addEventListener("click", () => {
            banner.remove();
            showErr("");
          });
          banner.appendChild(retryBtn);

          // 插入到错误区域前
          errEl.parentNode.insertBefore(banner, errEl);
        } else {
          showErr("操作失败：" + String(error));
        }
      }

      // 全局错误捕获（ErrorBoundary）
      window.addEventListener("error", (event) => {
        console.error("全局错误:", event.error);
        showStructuredError({
          message: "应用发生了意外错误",
          details: event.error?.message || String(event.error),
          suggestion: "请刷新页面重试，或报告此问题",
        });
        event.preventDefault();
      });

      window.addEventListener("unhandledrejection", (event) => {
        console.error("未处理的 Promise 拒绝:", event.reason);
        showStructuredError({
          message: "操作失败",
          details: event.reason?.message || String(event.reason),
          suggestion: "请重试此操作",
        });
        event.preventDefault();
      });

      // 选定项目：持久化 + spawn sidecar（Rust 侧 cmd_choose_project）。
      async function chooseProject(path) {
        showErr("");
        // 清除之前的错误横幅
        document.querySelectorAll(".err-banner").forEach((el) => el.remove());

        try {
          await invoke("cmd_choose_project", { path });
          showLaunching(); // Rust 健康后导航窗口到 sidecar
        } catch (e) {
          console.error("选择项目失败:", e);
          showStructuredError(e);
        }
      }

      // 项目类型 → 展示名。索引里没有的类型（或未来新增的）回退为原字符串，
      // 不做 throw：徽章是展示增强，不该因未知取值破坏 picker。
      const TYPE_LABELS = {
        nodejs: "Node.js",
        python: "Python",
        rust: "Rust",
        go: "Go",
        java: "Java",
        dotnet: ".NET",
        generic: "通用",
      };

      // 收藏切换：仅当该项已被 M6 索引收录（有 project_id）时可用。
      // 失败只回滚图标 + 提示，不影响选择项目这一主流程。
      async function toggleFavorite(projectId, btn) {
        const wasOn = btn.classList.contains("on");
        btn.classList.toggle("on", !wasOn);
        btn.setAttribute("aria-pressed", String(!wasOn));
        try {
          await invoke("toggle_favorite", { id: projectId });
        } catch (e) {
          console.error("切换收藏失败:", e);
          btn.classList.toggle("on", wasOn);
          btn.setAttribute("aria-pressed", String(wasOn));
          showErr("收藏状态更新失败：" + String(e));
        }
      }

      async function renderRecents(recents) {
        recentsEl.innerHTML = "";
        for (const r of recents) {
          const li = document.createElement("li");
          const span = document.createElement("span");
          const name = document.createElement("strong");
          name.textContent = r.name;
          const path = document.createElement("span");
          path.className = "path";
          path.textContent = r.path;
          span.appendChild(name);
          span.appendChild(document.createElement("br"));
          span.appendChild(path);
          li.appendChild(span);

          // M6f：右侧元信息区（类型徽章 + 收藏）。索引未命中时整个区域为空，
          // 展示与增强前一致。
          const meta = document.createElement("span");
          meta.className = "meta";

          if (r.project_type) {
            const badge = document.createElement("span");
            badge.className = "badge";
            badge.textContent = TYPE_LABELS[r.project_type] || r.project_type;
            meta.appendChild(badge);
          }

          if (r.project_id) {
            const fav = document.createElement("button");
            fav.className = r.is_favorite ? "fav on" : "fav";
            fav.textContent = "★";
            fav.title = "收藏/取消收藏";
            fav.setAttribute("aria-label", "收藏 " + r.name);
            fav.setAttribute("aria-pressed", String(!!r.is_favorite));
            // 阻止冒泡：点星标不应触发 li 的「选择项目」。
            fav.addEventListener("click", (event) => {
              event.stopPropagation();
              toggleFavorite(r.project_id, fav);
            });
            meta.appendChild(fav);
          }

          li.appendChild(meta);
          li.addEventListener("click", () => chooseProject(r.path));
          recentsEl.appendChild(li);
        }
      }

      // 启动：查启动状态 → 渲染 picker 或"启动中"。
      (async () => {
        try {
          const state = await invoke("cmd_get_launch_state");
          if (state.needs_project) {
            await renderRecents(state.recents || []);
            document.getElementById("pick").addEventListener("click", async () => {
              showErr("");
              document.querySelectorAll(".err-banner").forEach((el) => el.remove());

              try {
                const picked = await invoke("cmd_pick_project_dialog");
                if (picked) {
                  await chooseProject(picked);
                }
              } catch (e) {
                console.error("选择文件夹失败:", e);
                showStructuredError(e);
              }
            });

            // 插件管理入口：打开独立窗口（settings.html）
            document.getElementById("open-plugins").addEventListener("click", async () => {
              showErr("");
              try {
                await invoke("cmd_open_plugin_manager");
              } catch (e) {
                console.error("打开插件管理失败:", e);
                showErr("打开插件管理失败：" + String(e));
              }
            });
          } else {
            showLaunching();
          }
        } catch (e) {
          console.error("初始化失败:", e);
          showStructuredError({
            message: "应用初始化失败",
            details: String(e),
            suggestion: "请重启应用，或检查应用日志",
          });
        }
      })();
    </script>
  </body>
</html>
