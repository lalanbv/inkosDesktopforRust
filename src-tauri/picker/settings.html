<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <title>inkosDesktop · 插件管理</title>
    <style>
      html, body {
        margin: 0; min-height: 100%;
        background: #fafafa; color: #1a1a1a;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }
      main { max-width: 42rem; margin: 0 auto; padding: 2rem 1.5rem; }
      h1 { font-weight: 600; font-size: 1.25rem; margin: 0 0 0.5rem; }
      p { color: #666; margin: 0.4rem 0; font-size: 0.9rem; }
      .toolbar { display: flex; gap: 0.5rem; align-items: center; margin: 1.5rem 0 0.5rem; }
      button {
        font: inherit; padding: 0.5rem 1rem; border: 1px solid #d0d0d0;
        background: #fff; color: #1a1a1a; border-radius: 8px; cursor: pointer;
        transition: background 0.15s;
      }
      button:hover { background: #f0f0f0; }
      button.primary { background: #1d4ed8; color: #fff; border-color: #1d4ed8; }
      button.primary:hover { background: #1e3a8a; }
      button.danger { color: #b91c1c; border-color: #fecaca; }
      button.danger:hover { background: #fef2f2; }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      button.small { padding: 0.3rem 0.7rem; font-size: 0.85rem; }

      ul#plugins { list-style: none; padding: 0; margin: 0; }
      ul#plugins li {
        padding: 0.8rem 1rem; border: 1px solid #e0e0e0; border-radius: 8px;
        margin-bottom: 0.6rem; display: flex; justify-content: space-between;
        align-items: center; gap: 0.8rem; background: #fff;
      }
      .plugin-info { text-align: left; flex: 1; min-width: 0; }
      .plugin-name { font-weight: 600; font-size: 0.95rem; }
      .plugin-meta { color: #595959; font-size: 0.8rem; margin-top: 0.2rem; }
      .plugin-badge {
        display: inline-block; font-size: 0.7rem; padding: 0.1rem 0.45rem;
        border-radius: 4px; margin-left: 0.4rem; vertical-align: middle;
      }
      .badge-on { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
      .badge-off { background: #f3f4f6; color: #4b5563; border: 1px solid #e5e7eb; }
      .plugin-actions { display: flex; gap: 0.4rem; flex-shrink: 0; }
      .empty { text-align: center; color: #595959; padding: 3rem 1rem; }
      .err { color: #b91c1c; margin: 0.75rem 0; min-height: 1.2em; font-size: 0.85rem; }
      .muted { color: #595959; font-size: 0.85rem; }
      .metrics { color: #4b5563; font-size: 0.8rem; margin: 0.3rem 0 0; font-family: ui-monospace, monospace; }

      /* 配置编辑表单 */
      fieldset {
        border: 1px solid #e0e0e0; border-radius: 8px; margin: 0 0 1rem; padding: 0.8rem 1rem;
      }
      legend { font-weight: 600; font-size: 0.9rem; padding: 0 0.4rem; color: #1a1a1a; }
      .cfg-row { display: flex; align-items: center; gap: 0.6rem; margin: 0.5rem 0; }
      .cfg-row > label { flex: 0 0 11rem; font-size: 0.85rem; color: #1a1a1a; }
      .cfg-row > input[type="text"],
      .cfg-row > input[type="number"],
      .cfg-row > select {
        flex: 1; max-width: 18rem; font: inherit; font-size: 0.85rem; padding: 0.35rem 0.5rem;
        border: 1px solid #d0d0d0; border-radius: 6px; background: #fff; color: #1a1a1a;
      }
      .cfg-row > input[type="checkbox"] { width: 1rem; height: 1rem; }
      .cfg-hint { color: #595959; font-size: 0.78rem; margin: 0.2rem 0 0 11.6rem; }
      .cfg-actions { display: flex; gap: 0.5rem; align-items: center; margin-top: 0.5rem; }
      .form-msg { font-size: 0.82rem; min-height: 1.2em; }
      .form-msg.ok { color: #166534; }
      .form-msg.err { color: #b91c1c; }
      .hidden { display: none !important; }

      /* 插件市场列表（复用 plugin-info/name/meta/metrics 类） */
      ul#market-list { list-style: none; padding: 0; margin: 0; }
      ul#market-list > li {
        padding: 0.8rem 1rem; border: 1px solid #e0e0e0; border-radius: 8px;
        margin-bottom: 0.6rem; background: #fff;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 data-i18n="settings.title">插件管理</h1>
      <p class="muted" data-i18n="settings.muted">安装、启用、卸载 inkosDesktop 扩展插件。插件运行在进程隔离沙箱，按声明的权限访问资源。</p>

      <div class="toolbar">
        <button id="install" class="primary" data-i18n="settings.install">从目录安装…</button>
        <button id="refresh" data-i18n="settings.refresh">刷新</button>
      </div>
      <p class="metrics" id="metrics">加载指标中…</p>
      <p class="err" id="err"></p>

      <ul id="plugins" role="list" aria-label="已安装插件列表"><!-- 插件列表由 JS 注入 --></ul>
      <div id="empty" class="empty hidden" data-i18n="settings.empty">尚无已安装插件。点击「从目录安装」添加。</div>

      <section id="diagnostics" style="margin-top:2rem; text-align:left;">
        <h2 style="font-size:1rem; margin:0 0 0.5rem;" data-i18n="diag.title">系统诊断</h2>
        <p class="muted" style="margin:0 0 0.5rem;" data-i18n="diag.muted">聚合应用版本、引擎、插件/项目遥测、崩溃记录，便于排障。可复制报告附到 issue。</p>
        <pre id="diag-output" role="status" aria-live="polite" aria-atomic="true" style="background:#f3f4f6; padding:0.8rem; border-radius:8px; font-size:0.78rem; line-height:1.4; overflow-x:auto; max-height:20rem;">加载中…</pre>
        <div class="toolbar" style="margin-top:0.5rem;">
          <button id="diag-refresh" class="small" data-i18n="diag.refresh">刷新诊断</button>
          <button id="diag-copy" class="small" data-i18n="diag.copy">复制报告</button>
          <span class="err" id="diag-err" style="margin-left:0.5rem;"></span>
        </div>
      </section>

      <section id="config" style="margin-top:2rem; text-align:left;">
        <h2 style="font-size:1rem; margin:0 0 0.5rem;" data-i18n="config.title">用户配置</h2>
        <p class="muted" style="margin:0 0 0.5rem;" data-i18n="config.muted">全局偏好，应用于所有项目（除非被工作区/项目配置覆盖）。</p>

        <form id="config-form" aria-describedby="config-msg">
          <fieldset>
            <legend data-i18n="config.logging.legend">日志</legend>
            <div class="cfg-row">
              <label for="cfg-log-level" data-i18n="config.logging.level">日志级别</label>
              <select id="cfg-log-level">
                <option value="error" data-i18n="config.level.error">error</option>
                <option value="warn" data-i18n="config.level.warn">warn</option>
                <option value="info" data-i18n="config.level.info">info</option>
                <option value="debug" data-i18n="config.level.debug">debug</option>
                <option value="trace" data-i18n="config.level.trace">trace</option>
              </select>
            </div>
            <div class="cfg-row">
              <label for="cfg-log-retention" data-i18n="config.logging.retention">保留天数</label>
              <input id="cfg-log-retention" type="number" min="1" step="1" />
            </div>
          </fieldset>

          <fieldset>
            <legend data-i18n="config.updates.legend">更新</legend>
            <div class="cfg-row">
              <label for="cfg-upd-channel" data-i18n="config.updates.channel">更新通道</label>
              <select id="cfg-upd-channel">
                <option value="stable" data-i18n="config.channel.stable">stable</option>
                <option value="beta" data-i18n="config.channel.beta">beta</option>
                <option value="dev" data-i18n="config.channel.dev">dev</option>
              </select>
            </div>
            <div class="cfg-row">
              <label for="cfg-upd-interval" data-i18n="config.updates.interval">检查间隔（小时）</label>
              <input id="cfg-upd-interval" type="number" min="0" step="1" />
            </div>
            <div class="cfg-row">
              <label for="cfg-upd-auto" data-i18n="config.updates.auto_apply">自动应用更新</label>
              <input id="cfg-upd-auto" type="checkbox" />
            </div>
          </fieldset>

          <fieldset>
            <legend data-i18n="config.engine.legend">引擎</legend>
            <div class="cfg-row">
              <label for="cfg-eng-autodl" data-i18n="config.engine.auto_download">自动下载引擎</label>
              <input id="cfg-eng-autodl" type="checkbox" />
            </div>
            <div class="cfg-row">
              <label for="cfg-eng-policy" data-i18n="config.engine.version_policy">版本策略</label>
              <select id="cfg-eng-policy">
                <option value="latest" data-i18n="config.policy.latest">最新</option>
                <option value="fixed" data-i18n="config.policy.fixed">锁定版本</option>
                <option value="range" data-i18n="config.policy.range">版本范围</option>
              </select>
            </div>
            <div class="cfg-row hidden" id="cfg-eng-version-row">
              <label for="cfg-eng-version" data-i18n="config.engine.version">锁定版本</label>
              <input id="cfg-eng-version" type="text" placeholder="0.4.0" />
            </div>
            <div class="cfg-row hidden" id="cfg-eng-range-row">
              <label for="cfg-eng-range" data-i18n="config.engine.range">版本范围</label>
              <input id="cfg-eng-range" type="text" placeholder="^0.4.0" />
            </div>
          </fieldset>

          <fieldset>
            <legend data-i18n="config.network.legend">网络</legend>
            <div class="cfg-row">
              <label for="cfg-net-proxy" data-i18n="config.network.proxy">代理 URL</label>
              <input id="cfg-net-proxy" type="text" placeholder="http://host:port" />
            </div>
            <div class="cfg-row">
              <label for="cfg-net-timeout" data-i18n="config.network.timeout">超时（秒）</label>
              <input id="cfg-net-timeout" type="number" min="1" step="1" />
            </div>
          </fieldset>

          <div class="cfg-actions">
            <button type="submit" id="cfg-save" class="primary" data-i18n="config.save">保存</button>
            <button type="button" id="cfg-reset" class="danger" data-i18n="config.reset">重置为默认</button>
            <span class="form-msg" id="config-msg" role="status" aria-live="polite"></span>
          </div>
        </form>
      </section>

      <section id="market" style="margin-top:2rem; text-align:left;">
        <h2 style="font-size:1rem; margin:0 0 0.5rem;" data-i18n="market.title">插件市场</h2>
        <p class="muted" style="margin:0 0 0.5rem;" data-i18n="market.muted">浏览可安装的官方/社区插件（来自已配置的签名注册表）。市场安装能力待后续版本。</p>
        <div class="toolbar">
          <button id="market-refresh" class="small" data-i18n="market.refresh">刷新市场</button>
          <button id="market-check-updates" class="small" data-i18n="market.check_updates">检查更新</button>
          <span class="form-msg" id="market-msg" role="status" aria-live="polite"></span>
        </div>
        <ul id="market-list" role="list" aria-label="可安装插件列表"><!-- JS 注入 --></ul>
      </section>
    </main>

    <script>
      // Tauri 2 withGlobalTauri：window.__TAURI__.core.invoke 可调自定义命令。
      const { invoke } = window.__TAURI__.core;
      const pluginsEl = document.getElementById("plugins");
      const emptyEl = document.getElementById("empty");
      const errEl = document.getElementById("err");

      function showErr(msg) { errEl.textContent = msg || ""; }

      // i18n 渐进实施（与 picker 同机制）：中英字典 + locale 检测 + data-i18n。
      const I18N = {
        zh: {

          "market.title": "插件市场",
          "market.muted": "浏览可安装的官方/社区插件（来自已配置的签名注册表）。市场安装能力待后续版本。",
          "market.refresh": "刷新市场",
          "market.loading": "加载市场中…",
          "market.empty": "无可用插件（或当前宿主版本不兼容）。",
          "market.load_fail": "加载市场失败：",

          "market.installing": "安装中…",

        },
        en: {
          "settings.title": "Plugin Manager",
          "settings.muted": "Install, enable, uninstall inkosDesktop plugins. Plugins run in process-isolated sandbox, accessing resources by declared permissions.",
          "settings.install": "Install from Directory…",
          "settings.refresh": "Refresh",
          "settings.empty": "No plugins installed. Click \"Install from Directory\" to add.",
          "diag.title": "System Diagnostics",
          "diag.muted": "Aggregates app version, engine, plugin/project telemetry, crash records for troubleshooting. Copy report to attach to issues.",
          "diag.refresh": "Refresh Diagnostics",
          "diag.copy": "Copy Report",
          "config.title": "User Settings",
          "config.muted": "Global preferences applied to all projects unless overridden by workspace/project config.",
          "config.save": "Save",
          "config.reset": "Reset to Defaults",
          "config.logging.legend": "Logging",
          "config.logging.level": "Log Level",
          "config.logging.retention": "Retention (days)",
          "config.updates.legend": "Updates",
          "config.updates.channel": "Update Channel",
          "config.updates.interval": "Check Interval (hours)",
          "config.updates.auto_apply": "Auto-apply Updates",
          "config.engine.legend": "Engine",
          "config.engine.auto_download": "Auto-download Engine",
          "config.engine.version_policy": "Version Policy",
          "config.engine.version": "Pinned Version",
          "config.engine.range": "Version Range",
          "config.network.legend": "Network",
          "config.network.proxy": "Proxy URL",
          "config.network.timeout": "Timeout (seconds)",
          "config.level.error": "error (errors only)",
          "config.level.warn": "warn (warnings)",
          "config.level.info": "info (informational)",
          "config.level.debug": "debug (debug)",
          "config.level.trace": "trace (verbose)",
          "config.channel.stable": "stable",
          "config.channel.beta": "beta",
          "config.channel.dev": "dev",
          "config.policy.latest": "Latest",
          "config.policy.fixed": "Pinned Version",
          "config.policy.range": "Version Range",
          "config.saved": "Saved",
          "config.reset_done": "Reset to defaults",
          "config.load_fail": "Failed to load config: ",
          "config.save_fail": "Save failed: ",
          "config.reset_fail": "Reset failed: ",
          "market.title": "Plugin Marketplace",
          "market.muted": "Browse installable official/community plugins (from a configured, signed registry). Marketplace install is a future release.",
          "market.refresh": "Refresh Marketplace",
          "market.loading": "Loading marketplace…",
          "market.empty": "No plugins available (or incompatible with current host version).",
          "market.load_fail": "Failed to load marketplace: ",
          "market.install": "Install",
          "market.installing": "Installing…",
          "market.install_done": "Installed: ",
          "market.install_fail": "Install failed: ",
          "market.check_updates": "Check for Updates",
          "market.checking_updates": "Checking for updates…",
          "market.no_updates": "All plugins are up to date.",
          "market.updates_found": "{n} plugin(s) have updates.",
          "market.update": "Update",
          "market.updating": "Updating…",
          "market.update_done": "Updated: ",
          "market.update_fail": "Update failed: ",
          "market.other_versions": "Other Versions",
          "market.install_this": "Install This Version",
          "market.no_other_versions": "No other versions.",
        },
      };
      const LANG = (navigator.language || "zh").toLowerCase().startsWith("en") ? "en" : "zh";
      function t(key) { return (I18N[LANG] && I18N[LANG][key]) || key; }
      function applyI18n() {
        document.querySelectorAll("[data-i18n]").forEach((el) => {
          el.textContent = t(el.getAttribute("data-i18n"));
        });
      }
      applyI18n();

      // 插件能力（capability）→ 中文标签。未知值原样回显，不抛错。
      const CAP_LABELS = {
        read_project: "读项目",
        write_project: "写项目",
        filesystem: "文件系统",
        network: "网络",
        system_command: "系统命令",
        environment: "环境变量",
        database: "数据库",
        ui: "UI",
      };

      // 取 capability 的判别名（tag）。serde 对无字段变体序列化成字符串
      // ("read_project")，带字段变体序列化成单键对象
      // ({"system_command":{"allowed_commands":[...]}})。两种形态统一到 tag，
      // 避免各处各写一遍字符串/对象判断而漏掉一种（历史缺陷：安装告警只比对字符串，
      // system_command 加白名单字段后恒不匹配 → 告警静默失效）。
      function capabilityTag(cap) {
        if (typeof cap === "string") return cap;
        if (cap && typeof cap === "object") return Object.keys(cap)[0] || "";
        return "";
      }

      // 变体内部值 → 简短可读串。filesystem 是 { path: "..." }，
      // network/system_command 是 { allowed_*: [...] }——直接内插对象会得到
      // "[object Object]"，故按类型分派。
      function capabilityDetail(inner) {
        if (inner == null) return "";
        if (typeof inner === "string") return inner;
        if (Array.isArray(inner)) return inner.join(",");
        if (typeof inner === "object") {
          const vals = Object.values(inner);
          if (vals.length === 1) return capabilityDetail(vals[0]);
          return JSON.stringify(inner);
        }
        return String(inner);
      }

      function capabilityLabel(cap) {
        if (typeof cap === "string") return CAP_LABELS[cap] || cap;
        if (cap && typeof cap === "object") {
          const key = capabilityTag(cap);
          if (!CAP_LABELS[key]) return JSON.stringify(cap);
          const detail = capabilityDetail(cap[key]);
          return detail ? `${CAP_LABELS[key]}(${detail})` : CAP_LABELS[key];
        }
        return String(cap);
      }

      // 敏感权限 → 用户可读描述。进程隔离插件是原生进程，宿主无法强制这些边界
      // （能力声明对它只是声明性的），故安装时须让用户做信任决策。
      const SENSITIVE_CAPS = {
        network: "网络访问",
        system_command: "系统命令执行",
        filesystem: "任意文件系统路径",
        environment: "环境变量",
      };

      // 返回该 capabilities 列表中的敏感项描述（去重、保持 SENSITIVE_CAPS 顺序）。
      function sensitiveCapWarnings(caps) {
        const tags = new Set((caps || []).map(capabilityTag));
        return Object.entries(SENSITIVE_CAPS)
          .filter(([tag]) => tags.has(tag))
          .map(([, label]) => label);
      }

      // 安装成功提示（含敏感权限知情）。两条安装路径（本地目录 / 注册表）共用，
      // 防其中一条漏掉告警。
      function alertInstalled(meta) {
        const warnings = sensitiveCapWarnings(meta.capabilities);
        const warnText =
          warnings.length > 0
            ? `\n⚠ 此插件声明：${warnings.join("、")}。请确认来源可信（进程隔离插件不受宿主沙箱限制）。`
            : "";
        alert(`安装成功：${meta.name || meta.id} v${meta.version || ""}${warnText}`);
      }

      async function loadPlugins() {
        showErr("");
        try {
          const plugins = await invoke("list_plugins");
          renderPlugins(plugins || []);
        } catch (e) {
          showErr("加载插件失败：" + String(e));
        }
      }

      // 遥测：插件执行聚合指标（次数/均耗时/失败）。失败静默——指标非关键功能，
      // 不应因后端未启用 PluginState 而阻塞面板渲染。
      async function loadMetrics() {
        try {
          const m = await invoke("get_plugin_metrics");
          const el = document.getElementById("metrics");
          if (m && typeof m.exec_count === "number") {
            let text = `调用 ${m.exec_count} 次 · 均耗时 ${m.avg_us}μs · 失败 ${m.exec_failures} 次`;
            // 自动禁用计数（> 0 = 插件系统不稳定）
            if (m.auto_disabled_count > 0) {
              text += ` · ⛔ 自动禁用 ${m.auto_disabled_count} 次`;
            }
            // per-plugin 连续失败预警：consec_failures > 0 说明插件处于故障累积中
            if (Array.isArray(m.per_plugin) && m.per_plugin.length > 0) {
              const warns = m.per_plugin
                .map((p) => `${p.plugin_id}(${p.consecutive_failures}/${5})`)
                .join(", ");
              text += ` · ⚠ 连续失败：${warns}`;
            }
            // 最近自动禁用插件列表（最新在末尾）：精确到具体插件，帮助快速定位不稳定源
            if (Array.isArray(m.recently_auto_disabled) && m.recently_auto_disabled.length > 0) {
              text += ` · 🔴 最近禁用：${m.recently_auto_disabled.join(", ")}`;
            }
            el.textContent = text;
          }
        } catch (_) {
          /* 指标不可用（如插件子系统未初始化），忽略 */
        }
      }

      function renderPlugins(plugins) {
        pluginsEl.innerHTML = "";
        if (plugins.length === 0) {
          emptyEl.classList.remove("hidden");
          return;
        }
        emptyEl.classList.add("hidden");

        for (const p of plugins) {
          const li = document.createElement("li");
          li.setAttribute("role", "listitem"); // a11y：与 ul role=list 配对的显式语义

          const info = document.createElement("div");
          info.className = "plugin-info";

          const name = document.createElement("div");
          name.className = "plugin-name";
          name.textContent = p.name || p.id;

          const badge = document.createElement("span");
          badge.className = p.enabled ? "plugin-badge badge-on" : "plugin-badge badge-off";
          badge.textContent = p.enabled ? "已启用" : "已禁用";
          name.appendChild(badge);
          info.appendChild(name);

          const meta = document.createElement("div");
          meta.className = "plugin-meta";
          const caps = (p.capabilities || []).map(capabilityLabel).join("、") || "无权限声明";
          meta.textContent = `${p.id} · v${p.version || "?"} · ${p.author || "未知"} · ${caps}`;
          info.appendChild(meta);

          li.appendChild(info);

          const actions = document.createElement("div");
          actions.className = "plugin-actions";

          const toggleBtn = document.createElement("button");
          toggleBtn.className = "small";
          toggleBtn.textContent = p.enabled ? "禁用" : "启用";
          toggleBtn.addEventListener("click", () => togglePlugin(p.id, p.enabled));
          actions.appendChild(toggleBtn);

          const uninstallBtn = document.createElement("button");
          uninstallBtn.className = "small danger";
          uninstallBtn.textContent = "卸载";
          uninstallBtn.addEventListener("click", () => uninstallPlugin(p.id, p.name || p.id));
          actions.appendChild(uninstallBtn);

          li.appendChild(actions);
          pluginsEl.appendChild(li);
        }
      }

      async function togglePlugin(id, currentlyEnabled) {
        const cmd = currentlyEnabled ? "disable_plugin" : "enable_plugin";
        showErr("");
        try {
          await invoke(cmd, { id });
          // 通知其他插件（best-effort）
          const event = currentlyEnabled ? "plugin.disabled" : "plugin.enabled";
          invoke("cmd_broadcast_event", {
            event,
            payload: JSON.stringify({ id }),
          }).catch((e) => console.warn(`[inkos] broadcast ${event} 失败:`, e));
          await loadPlugins();
        } catch (e) {
          showErr(`${currentlyEnabled ? "禁用" : "启用"}失败：` + String(e));
        }
      }

      async function uninstallPlugin(id, name) {
        if (!confirm(`确定卸载插件「${name}」？此操作会删除插件文件。`)) return;
        showErr("");
        try {
          await invoke("uninstall_plugin", { id });
          // 通知其他插件（best-effort）
          invoke("cmd_broadcast_event", {
            event: "plugin.uninstalled",
            payload: JSON.stringify({ id }),
          }).catch((e) => console.warn("[inkos] broadcast plugin.uninstalled 失败:", e));
          await loadPlugins();
        } catch (e) {
          showErr("卸载失败：" + String(e));
        }
      }

      let pickingDir = false;
      async function installFromDir() {
        if (pickingDir) return; // 对话框打开期间防重入（避免叠加原生面板）
        pickingDir = true;
        showErr("");
        try {
          // 复用 picker 的原生目录选择对话框（Rust 侧回调式 pick_folder）
          const picked = await invoke("cmd_pick_project_dialog");
          if (!picked) return;
          const meta = await invoke("install_plugin", { path: picked });
          // 通知其他插件（best-effort）
          invoke("cmd_broadcast_event", {
            event: "plugin.installed",
            payload: JSON.stringify({ id: meta.id, version: meta.version }),
          }).catch((e) => console.warn("[inkos] broadcast plugin.installed 失败:", e));
          await loadPlugins();

          // 安装时安全知情：声明敏感权限则提示用户做信任决策。
          // 进程隔离插件是独立进程，OS 级网络沙箱无 root 跨平台不可行（unshare 需
          // CAP_SYS_ADMIN），故在 UX 层告知，由用户判断来源可信度。
          // （WASM 插件则由 host_api 强制白名单，这是强隔离的安全替代。）
          alertInstalled(meta);
        } catch (e) {
          showErr("安装失败：" + String(e));
        } finally {
          pickingDir = false;
        }
      }

      // 系统诊断：聚合 cmd_get_diagnostics + 双 metrics，展示 + 复制报告。
      // 各后端独立容错——某子系统未启用（如插件 state 未 manage）不影响其余展示。
      async function loadDiagnostics() {
        const out = document.getElementById("diag-output");
        const errEl = document.getElementById("diag-err");
        errEl.textContent = "";
        out.textContent = "加载中…";
        try {
          // 并行拉取，单项失败返回 null 不拖垮整体
          const [diag, plugMetrics, projMetrics, config] = await Promise.all([
            invoke("cmd_get_diagnostics").catch((e) => {
              errEl.textContent = "诊断部分失败：" + String(e);
              return null;
            }),
            invoke("get_plugin_metrics").catch(() => null),
            invoke("get_project_metrics").catch(() => null),
            invoke("get_config").catch(() => null),
          ]);
          const report = {
            app: diag
              ? { version: diag.version, platform: diag.platform, arch: diag.arch }
              : null,
            dirs: diag
              ? {
                  app_data: diag.app_data_dir,
                  engine: diag.engine_dir,
                  node_cache: diag.node_cache_dir,
                  projects: diag.projects_file,
                }
              : null,
            engine_manifest: diag ? diag.engine_manifest : null,
            // 合并配置（只读展示；编辑需工作区上下文，在 sidecar 内进行）
            config: config,
            telemetry: { plugin: plugMetrics, project: projMetrics },
            recent_crashes: diag ? diag.recent_crashes : [],
          };
          out.textContent = JSON.stringify(report, null, 2);
        } catch (e) {
          out.textContent = "";
          errEl.textContent = "诊断加载失败：" + String(e);
        }
      }

      // === 用户配置（User 层）编辑：get_config 读 → 表单 → update_config("user") 写 ===
      function syncPolicyRows() {
        const p = document.getElementById("cfg-eng-policy").value;
        document.getElementById("cfg-eng-version-row").classList.toggle("hidden", p !== "fixed");
        document.getElementById("cfg-eng-range-row").classList.toggle("hidden", p !== "range");
      }

      function numVal(id, dflt) {
        const n = Number(document.getElementById(id).value);
        return Number.isFinite(n) && n >= 0 ? n : dflt;
      }

      function buildConfigFromForm() {
        const policy = document.getElementById("cfg-eng-policy").value;
        let version_policy;
        if (policy === "fixed") {
          version_policy = { fixed: document.getElementById("cfg-eng-version").value.trim() };
        } else if (policy === "range") {
          version_policy = { range: document.getElementById("cfg-eng-range").value.trim() };
        } else {
          version_policy = "latest";
        }
        const proxyRaw = document.getElementById("cfg-net-proxy").value.trim();
        return {
          engine: {
            version_policy,
            auto_download: document.getElementById("cfg-eng-autodl").checked,
          },
          updates: {
            check_interval_hours: numVal("cfg-upd-interval", 24),
            channel: document.getElementById("cfg-upd-channel").value,
            auto_apply: document.getElementById("cfg-upd-auto").checked,
          },
          logging: {
            level: document.getElementById("cfg-log-level").value,
            retention_days: numVal("cfg-log-retention", 7),
          },
          network: {
            proxy: proxyRaw === "" ? null : proxyRaw,
            timeout_seconds: numVal("cfg-net-timeout", 30),
          },
        };
      }

      function populateConfigForm(config) {
        const logging = config.logging || {};
        document.getElementById("cfg-log-level").value = logging.level || "info";
        document.getElementById("cfg-log-retention").value = logging.retention_days ?? 7;

        const updates = config.updates || {};
        document.getElementById("cfg-upd-channel").value = updates.channel || "stable";
        document.getElementById("cfg-upd-interval").value = updates.check_interval_hours ?? 24;
        document.getElementById("cfg-upd-auto").checked = !!updates.auto_apply;

        const engine = config.engine || {};
        document.getElementById("cfg-eng-autodl").checked = !!engine.auto_download;
        // version_policy 反序列化形态：`"latest"` | `{fixed:"x"}` | `{range:"^x"}`
        const vp = engine.version_policy;
        let policy = "latest", version = "", range = "";
        if (vp && typeof vp === "object") {
          if ("fixed" in vp) { policy = "fixed"; version = vp.fixed || ""; }
          else if ("range" in vp) { policy = "range"; range = vp.range || ""; }
        }
        document.getElementById("cfg-eng-policy").value = policy;
        document.getElementById("cfg-eng-version").value = version;
        document.getElementById("cfg-eng-range").value = range;
        syncPolicyRows();

        const network = config.network || {};
        document.getElementById("cfg-net-proxy").value = network.proxy || "";
        document.getElementById("cfg-net-timeout").value = network.timeout_seconds ?? 30;
      }

      async function loadConfig() {
        const msgEl = document.getElementById("config-msg");
        try {
          const config = await invoke("get_config");
          if (!config) return;
          populateConfigForm(config);
          msgEl.textContent = "";
          msgEl.className = "form-msg";
        } catch (e) {
          msgEl.textContent = t("config.load_fail") + String(e);
          msgEl.className = "form-msg err";
        }
      }

      async function saveConfig(event) {
        event.preventDefault();
        const msgEl = document.getElementById("config-msg");
        const saveBtn = document.getElementById("cfg-save");
        msgEl.textContent = "";
        msgEl.className = "form-msg";
        saveBtn.disabled = true;
        try {
          const config = buildConfigFromForm();
          await invoke("update_config", { layer: "user", config });
          msgEl.textContent = t("config.saved");
          msgEl.className = "form-msg ok";
        } catch (e) {
          msgEl.textContent = t("config.save_fail") + String(e);
          msgEl.className = "form-msg err";
        } finally {
          saveBtn.disabled = false;
        }
      }

      async function resetConfig() {
        const msgEl = document.getElementById("config-msg");
        msgEl.textContent = "";
        msgEl.className = "form-msg";
        try {
          await invoke("reset_config", { layer: "user" });
          await loadConfig(); // merged 回退系统默认，重新填充表单
          msgEl.textContent = t("config.reset_done");
          msgEl.className = "form-msg ok";
        } catch (e) {
          msgEl.textContent = t("config.reset_fail") + String(e);
          msgEl.className = "form-msg err";
        }
      }

      // 缓存最近一次市场拉取的条目，供「检查更新」对照渲染更新按钮
      let marketCache = [];

      // === 插件市场：cmd_fetch_plugin_registry 拉取已兼容过滤的条目（首次端到端走通注册表管线）===
      async function loadMarket() {
        const listEl = document.getElementById("market-list");
        const msgEl = document.getElementById("market-msg");
        listEl.innerHTML = "";
        msgEl.className = "form-msg";
        msgEl.textContent = t("market.loading");
        try {
          const entries = await invoke("cmd_fetch_plugin_registry");
          msgEl.textContent = "";
          marketCache = entries || [];
          renderMarket(marketCache, null);
        } catch (e) {
          // 未配置 registry 等 → 提示去 config 设置
          msgEl.className = "form-msg err";
          msgEl.textContent = t("market.load_fail") + String(e);
        }
      }

      function renderMarket(entries, upMap) {
        const listEl = document.getElementById("market-list");
        listEl.innerHTML = "";
        if (entries.length === 0) {
          const li = document.createElement("li");
          li.className = "plugin-info";
          li.textContent = t("market.empty");
          listEl.appendChild(li);
          return;
        }
        for (const e of entries) {
          const li = document.createElement("li");

          // 顶行：信息 + 动作（安装/更新 + 其他版本）
          const topRow = document.createElement("div");
          topRow.style.display = "flex";
          topRow.style.justifyContent = "space-between";
          topRow.style.alignItems = "center";
          topRow.style.gap = "0.8rem";

          const info = document.createElement("div");
          info.className = "plugin-info";
          const name = document.createElement("div");
          name.className = "plugin-name";
          name.textContent = `${e.name || e.id} v${e.version || "?"}`;
          info.appendChild(name);
          const meta = document.createElement("div");
          meta.className = "plugin-meta";
          const caps = (e.capabilities || []).map(capabilityLabel).join("、") || "无权限声明";
          meta.textContent = `${e.id} · ${e.author || "?"} · ${caps}`;
          info.appendChild(meta);
          if (e.description) {
            const desc = document.createElement("div");
            desc.className = "metrics";
            desc.textContent = e.description;
            info.appendChild(desc);
          }
          topRow.appendChild(info);

          const actions = document.createElement("div");
          actions.className = "plugin-actions";
          const hasUpdate = upMap && upMap.has(e.id);
          const installBtn = document.createElement("button");
          installBtn.className = "small" + (hasUpdate ? " primary" : "");
          installBtn.textContent = hasUpdate ? t("market.update") : t("market.install");
          installBtn.addEventListener("click", () =>
            hasUpdate ? updateFromRegistry(e) : installFromRegistry(e)
          );
          actions.appendChild(installBtn);
          // 「其他版本」展开（锁定/回滚指定版本）
          const versionsBtn = document.createElement("button");
          versionsBtn.className = "small";
          versionsBtn.textContent = t("market.other_versions");
          const versionsDiv = document.createElement("div");
          versionsDiv.className = "hidden";
          versionsDiv.style.marginTop = "0.5rem";
          versionsBtn.addEventListener("click", () => toggleVersions(e.id, versionsDiv));
          actions.appendChild(versionsBtn);
          topRow.appendChild(actions);

          li.appendChild(topRow);
          li.appendChild(versionsDiv);
          listEl.appendChild(li);
        }
      }

      async function installFromRegistry(entry) {
        const msgEl = document.getElementById("market-msg");
        msgEl.className = "form-msg";
        msgEl.textContent = t("market.installing");
        try {
          const meta = await invoke("cmd_install_from_registry", { entry });
          // 通知其他插件（best-effort）
          invoke("cmd_broadcast_event", {
            event: "plugin.installed",
            payload: JSON.stringify({ id: meta.id, version: meta.version }),
          }).catch((e) => console.warn("[inkos] broadcast plugin.installed 失败:", e));
          msgEl.className = "form-msg ok";
          msgEl.textContent = t("market.install_done") + (meta.name || meta.id);
          await loadPlugins(); // 刷新已安装列表
          // 敏感权限知情——与本地目录安装同一函数。注册表插件虽经 Ed25519 验签，
          // 但签名只证明「未被中间人篡改」，不证明发布者无恶意或未被入侵；
          // 进程隔离插件的能力声明对宿主是声明性的，须由用户做信任决策。
          alertInstalled(meta);
        } catch (e) {
          msgEl.className = "form-msg err";
          msgEl.textContent = t("market.install_fail") + String(e);
        }
      }

      async function checkUpdates() {
        const msgEl = document.getElementById("market-msg");
        msgEl.className = "form-msg";
        msgEl.textContent = t("market.checking_updates");
        try {
          const updates = await invoke("cmd_check_plugin_updates");
          if (updates.length === 0) {
            msgEl.className = "form-msg ok";
            msgEl.textContent = t("market.no_updates");
            renderMarket(marketCache, null);
          } else {
            msgEl.className = "form-msg ok";
            msgEl.textContent = t("market.updates_found").replace("{n}", updates.length);
            renderMarket(marketCache, new Map(updates.map((u) => [u.id, u])));
          }
        } catch (e) {
          msgEl.className = "form-msg err";
          msgEl.textContent = t("market.load_fail") + String(e);
        }
      }

      async function updateFromRegistry(entry) {
        const msgEl = document.getElementById("market-msg");
        msgEl.className = "form-msg";
        msgEl.textContent = t("market.updating");
        try {
          const meta = await invoke("cmd_update_plugin_from_registry", { entry });
          msgEl.className = "form-msg ok";
          msgEl.textContent = t("market.update_done") + (meta.name || meta.id);
          await loadPlugins(); // 刷新已安装列表
          await checkUpdates(); // 刷新更新状态（已更新的插件不再标记）
        } catch (e) {
          msgEl.className = "form-msg err";
          msgEl.textContent = t("market.update_fail") + String(e);
        }
      }

      // 展开/收起某插件的全部版本（锁定/回滚指定版本）。首次加载后仅切换显隐。
      async function toggleVersions(id, container) {
        if (container.dataset.loaded) {
          container.classList.toggle("hidden");
          return;
        }
        try {
          const versions = await invoke("cmd_list_plugin_versions", { id });
          container.innerHTML = "";
          if (versions.length <= 1) {
            container.textContent = t("market.no_other_versions");
          } else {
            for (const v of versions) {
              const row = document.createElement("div");
              row.style.margin = "0.25rem 0";
              const label = document.createElement("span");
              label.className = "metrics";
              label.style.marginRight = "0.5rem";
              label.textContent = `v${v.version}`;
              row.appendChild(label);
              const btn = document.createElement("button");
              btn.className = "small";
              btn.textContent = t("market.install_this");
              btn.addEventListener("click", () => installFromRegistry(v));
              row.appendChild(btn);
              container.appendChild(row);
            }
          }
          container.dataset.loaded = "1";
          container.classList.remove("hidden");
        } catch (e) {
          container.textContent = t("market.load_fail") + String(e);
          container.classList.remove("hidden");
        }
      }

      document.getElementById("market-refresh").addEventListener("click", loadMarket);
      document.getElementById("market-check-updates").addEventListener("click", checkUpdates);

      document.getElementById("config-form").addEventListener("submit", saveConfig);
      document.getElementById("cfg-reset").addEventListener("click", resetConfig);
      document.getElementById("cfg-eng-policy").addEventListener("change", syncPolicyRows);

      document.getElementById("install").addEventListener("click", installFromDir);
      document.getElementById("refresh").addEventListener("click", async () => {
        await loadPlugins();
        await loadMetrics();
      });

      document.getElementById("diag-refresh").addEventListener("click", loadDiagnostics);
      document.getElementById("diag-copy").addEventListener("click", async () => {
        const text = document.getElementById("diag-output").textContent;
        try {
          await navigator.clipboard.writeText(text);
          document.getElementById("diag-err").textContent = "已复制到剪贴板";
        } catch (e) {
          document.getElementById("diag-err").textContent = "复制失败：" + String(e);
        }
      });

      // 全局错误兜底
      window.addEventListener("unhandledrejection", (event) => {
        showErr(String(event.reason || "操作失败"));
        event.preventDefault();
      });

      // 初始加载：列表 + 指标 + 诊断 + 配置 + 市场
      loadPlugins();
      loadMetrics();
      loadDiagnostics();
      loadConfig();
      loadMarket();
    </script>
  </body>
</html>
